<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="claude:viewport-fit-sides" content="cover">
<meta name="robots" content="noindex, nofollow">
<title>NSE Digest</title>
<style>
/* Layout: one column, one view. Sticky header holds the only control; the
   gated list sits above the shortlist so the stronger claim is read first. */
:root{
  color-scheme: light;
  --bg:#ffffff;
  --surface:#f6f7fa;
  --surface-2:#eef1f6;
  --line:#dfe3ea;
  --line-strong:#c6ccd8;
  --ink:#12151b;
  --ink-2:#4b5264;
  --ink-3:#79818f;
  --accent:#1b43c8;
  --accent-soft:#eaeeff;
  --up:#0a6d3c;
  --up-soft:#e7f4ec;
  --down:#b32626;
  --down-soft:#fdeceb;
  --warn:#8a5000;
  --warn-soft:#fff3e0;
  /* System stacks only. V3's stack rule is explicit: no CDN, no external
     fonts. Any webfont here would be a silent dependency on a third party
     for a page that must render identically offline. */
  --sans:system-ui,-apple-system,"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif;
  --mono:ui-monospace,SFMono-Regular,"SF Mono",Menlo,Consolas,"Liberation Mono",monospace;
  --r:6px;
}
*{box-sizing:border-box}
html,body{margin:0;padding:0}
body{
  background:var(--bg); color:var(--ink);
  font-family:var(--sans); font-size:15px; line-height:1.5;
  -webkit-text-size-adjust:100%;
}
.wrap{
  max-width:1040px; margin:0 auto;
  padding-left:max(16px, env(safe-area-inset-left, 0px));
  padding-right:max(16px, env(safe-area-inset-right, 0px));
}
a{color:var(--accent)}
a:hover{text-decoration:underline}
:focus-visible{outline:2px solid var(--accent); outline-offset:2px}
.num{font-family:var(--mono); font-variant-numeric:tabular-nums}

/* ---------- header ---------- */
body::before{
  content:""; position:fixed; inset:0 0 auto;
  height:env(safe-area-inset-top, 0px); z-index:10; background:var(--bg);
}
header{
  position:sticky; top:env(safe-area-inset-top, 0px); z-index:9;
  background:var(--bg); border-bottom:1px solid var(--line);
}
.masthead{display:flex; flex-wrap:wrap; align-items:baseline; gap:6px 14px; padding-block:14px 10px}
h1{margin:0; font-size:19px; font-weight:600; letter-spacing:-.02em}
.tagline{color:var(--ink-3); font-size:13px}
.stamps{display:flex; flex-wrap:wrap; gap:6px; padding-bottom:12px}
.stamp{
  font-family:var(--mono); font-size:11px; padding:3px 8px;
  border:1px solid var(--line); border-radius:var(--r);
  background:var(--surface); color:var(--ink-2); white-space:nowrap;
}
.stamp b{color:var(--ink); font-weight:500}
.stamp.warn{background:var(--warn-soft); border-color:#f0d9ae; color:var(--warn)}
.stamp.warn b{color:var(--warn)}
.stamp.bad{background:var(--down-soft); border-color:#f3c9c6; color:var(--down)}
.stamp.bad b{color:var(--down)}

/* ---------- mode selector ---------- */
.modes{display:flex; gap:8px; padding-bottom:14px; flex-wrap:wrap}
.mode{
  flex:1 1 150px; min-width:0; text-align:left; cursor:pointer;
  background:var(--surface); border:1px solid var(--line);
  border-radius:var(--r); padding:10px 12px; font:inherit; color:var(--ink-2);
}
.mode:hover{border-color:var(--line-strong)}
.mode[aria-pressed="true"]{
  background:var(--accent-soft); border-color:var(--accent); color:var(--ink);
}
.mode .mt{display:block; font-weight:600; font-size:14px; color:var(--ink)}
.mode .ms{display:block; font-size:12px; color:var(--ink-3); margin-top:1px}
.modes.drivers{padding-top:0; padding-bottom:16px}
.mode.sm{padding:6px 10px}
.mode.sm .mt{font-size:13px}
.mode.sm .ms{font-size:11px}
.tag.news{background:#eef4ff; border-color:#c9d8f3; color:#1f4ea8}

/* ---------- sections ---------- */
section{padding-block:18px}
.sechead{display:flex; flex-wrap:wrap; align-items:baseline; gap:4px 12px; margin-bottom:4px}
h2{margin:0; font-size:15px; font-weight:600; letter-spacing:-.01em}
.count{font-family:var(--mono); font-size:12px; color:var(--ink-3)}
.sub{color:var(--ink-2); font-size:13px; margin:0 0 12px; max-width:68ch}

/* ---------- table ---------- */
.tablewrap{overflow-x:auto; border:1px solid var(--line); border-radius:var(--r)}
table{border-collapse:collapse; width:100%; font-size:14px}
th,td{padding:9px 11px; text-align:right; white-space:nowrap}
th:first-child,td:first-child{text-align:left}
th:last-child,td:last-child{text-align:left}
thead th{
  background:var(--surface); color:var(--ink-3); font-size:11px;
  font-weight:500; text-transform:uppercase; letter-spacing:.06em;
  border-bottom:1px solid var(--line);
}
tbody tr{border-top:1px solid var(--line); cursor:pointer}
tbody tr:hover{background:var(--surface)}
tbody tr.open{background:var(--accent-soft)}
.sym{font-weight:600}
.up{color:var(--up)} .down{color:var(--down)} .flat{color:var(--ink-3)}
tr.detail{cursor:default}
tr.detail>td{background:var(--surface); white-space:normal; text-align:left; padding:14px 11px}

/* ---------- tags ---------- */
.tag{
  display:inline-block; font-size:11px; font-family:var(--mono);
  padding:2px 7px; border-radius:var(--r); margin:2px 3px 2px 0;
  border:1px solid var(--line); background:var(--bg); color:var(--ink-2);
}
.tag.move-up{background:var(--up-soft); border-color:#bfe3cd; color:var(--up)}
.tag.move-down{background:var(--down-soft); border-color:#f3c9c6; color:var(--down)}
.tag.volume{background:var(--accent-soft); border-color:#c3cefc; color:var(--accent)}
.tag.breakout{background:var(--warn-soft); border-color:#f0d9ae; color:var(--warn)}
.tag.squeeze,.tag.result{background:var(--surface-2)}
.tag.v-BULLISH{background:var(--up-soft); border-color:#bfe3cd; color:var(--up)}
.tag.v-BEARISH{background:var(--down-soft); border-color:#f3c9c6; color:var(--down)}

/* ---------- detail ---------- */
.dgrid{display:grid; gap:14px; grid-template-columns:repeat(auto-fit,minmax(240px,1fr))}
.dcard{min-width:0}
.dcard h3{
  margin:0 0 7px; font-size:11px; font-weight:500; color:var(--ink-3);
  text-transform:uppercase; letter-spacing:.06em;
}
.kv{display:grid; grid-template-columns:auto 1fr; gap:3px 12px; font-size:13px; margin:0}
.kv dt{color:var(--ink-3); font-family:var(--mono)}
.kv dd{margin:0; font-family:var(--mono); font-variant-numeric:tabular-nums}
.note{font-size:13px; color:var(--ink-2); margin:4px 0; padding-left:10px; border-left:2px solid var(--line)}
.note.bad{border-left-color:var(--down)}

/* Index & derivatives. The four buildup states are deliberately NOT coloured
   green/red: they describe positioning that has already happened, not a
   direction, and a green "long buildup" badge would read as a buy signal the
   classifier never made. Neutral surface for all four. */
.idxline{display:flex; flex-wrap:wrap; align-items:baseline; gap:6px 16px; margin-bottom:10px}
.idxval{font-family:var(--mono); font-variant-numeric:tabular-nums;
  font-size:19px; font-weight:600; color:var(--ink)}
.idxlab{font-size:12px; color:var(--ink-3)}
.tag.bu{background:var(--surface-2); border-color:var(--line-strong); color:var(--ink-2)}
.tag.nostate{background:var(--surface); border-color:var(--line); color:var(--ink-3);
  font-style:italic}
.mtf th:not(:first-child),.mtf td:not(:first-child){text-align:right}
.mtf td:last-child,.mtf th:last-child{text-align:right}
.mtf .ind{color:var(--ink-2)}
.hitbar{display:grid; grid-template-columns:auto 1fr; gap:2px 10px; font-size:13px}
.nitem{padding:7px 0; border-top:1px solid var(--line)}
.nitem:first-of-type{border-top:0}
.nmeta{font-family:var(--mono); font-size:11px; color:var(--ink-3); margin-top:2px}

/* ---------- callouts ---------- */
.callout{
  border:1px solid var(--line); border-left:3px solid var(--accent);
  border-radius:var(--r); background:var(--surface); padding:12px 14px;
  font-size:13px; color:var(--ink-2);
}
.callout.warn{border-left-color:var(--warn); background:var(--warn-soft)}
.callout b{color:var(--ink); font-weight:600}
.callout p{margin:0 0 6px}
.callout p:last-child{margin:0}
.callout code{font-family:var(--mono); font-size:12px; background:var(--bg);
  border:1px solid var(--line); border-radius:3px; padding:1px 4px}
details{border:1px solid var(--line); border-radius:var(--r); background:var(--bg)}
summary{padding:10px 12px; cursor:pointer; font-size:13px; color:var(--ink-2)}
summary:hover{color:var(--ink)}
details[open] summary{border-bottom:1px solid var(--line); color:var(--ink)}
.dbody{padding:12px}
.rlist{display:grid; gap:4px; font-size:13px}
.rrow{display:flex; gap:10px; align-items:baseline}
.rn{font-family:var(--mono); color:var(--ink-3); min-width:4ch; text-align:right}
.empty{padding:20px 12px; text-align:center; color:var(--ink-3); font-size:14px}
.err{border:1px solid var(--down); border-left:3px solid var(--down);
  border-radius:var(--r); background:var(--down-soft); color:var(--down);
  padding:12px 14px; margin:16px 0; font-size:14px}

footer{border-top:1px solid var(--line); margin-top:10px}
.disc{padding-block:14px 22px; font-size:12px; color:var(--ink-3); max-width:72ch}

@media (max-width:620px){
  body{font-size:14px}
  th,td{padding:8px 9px; font-size:13px}
  .mode{flex:1 1 100%}
}
@media (prefers-reduced-motion:reduce){*{transition:none!important; animation:none!important}}
</style>
</head>
<body>

<header>
  <div class="wrap">
    <div class="masthead">
      <h1>NSE Digest</h1>
      <span class="tagline">conditional levels from NSE data &mdash; not advice</span>
    </div>
    <div class="stamps" id="stamps"></div>
    <div class="modes" id="modes" role="group" aria-label="Horizon"></div>
    <div class="modes drivers" id="drivers" role="group" aria-label="What to show"></div>
  </div>
</header>

<main class="wrap">
  <div id="fatal"></div>
  <div id="banner"></div>

  <section id="sec-index">
    <div class="sechead">
      <h2>Index &amp; derivatives</h2>
      <span class="count" id="idx-count"></span>
    </div>
    <p class="sub" id="idx-sub"></p>
    <div class="modes" id="idx-tabs" role="group" aria-label="Instrument"></div>
    <div id="idx-body"></div>
  </section>

  <section id="sec-gated">
    <div class="sechead">
      <h2>Trade-ready</h2>
      <span class="count" id="gated-count"></span>
    </div>
    <p class="sub" id="gated-sub"></p>
    <div id="gated-body"></div>
  </section>

  <section id="sec-short">
    <div class="sechead">
      <h2>Shortlist to research</h2>
      <span class="count" id="short-count"></span>
    </div>
    <p class="sub" id="short-sub"></p>
    <div id="short-body"></div>
  </section>

  <section id="sec-why">
    <details id="why">
      <summary id="why-summary">Why so few passed</summary>
      <div class="dbody">
        <p class="sub" id="why-sub"></p>
        <div class="rlist" id="why-body"></div>
      </div>
    </details>
  </section>
</main>

<footer>
  <div class="wrap disc" id="disclaimer"></div>
</footer>

<script>
"use strict";
/* Everything displayed comes from ./data.json and ./news.json, fetched at
   runtime with relative paths so the file works from a Pages subpath, a local
   server, or published alongside its data. */
var DATA = null, NEWS = null, PRIV = null, IDX = null;
var mode = null;
var driver = "moving";

/* The second control. Each option names ONE sort key, stated on the page, so
   the ordering is checkable. There is deliberately no "best overall" option:
   that would need weights nobody has fitted against costed outcomes. */
var DRIVERS = [
  { key: "moving", title: "Moving now",
    sub: "largest session move, then volume against its own 10-bar average" },
  { key: "news",   title: "News catalyst",
    sub: "highest classified headline materiality. Broker calls score zero" },
  { key: "upside", title: "Upside potential",
    sub: "closest to its nearest real overhead level, measured R:R preferred" },
  { key: "any",    title: "Momentum",
    sub: "momentum percentile within its own size segment" }
];

var MODES = [
  { key: "intraday",   title: "Intraday",   sub: "same-day, needs broker candles" },
  { key: "positional", title: "Short term", sub: "days to weeks, daily bars" },
  { key: "longterm",   title: "Long term",  sub: "months, daily and weekly" }
];

function $(id){ return document.getElementById(id); }
function el(t, c, txt){
  var n = document.createElement(t);
  if (c) n.className = c;
  if (txt !== undefined && txt !== null) n.textContent = String(txt);
  return n;
}
var DASH = "—";
function num(v, dp){
  if (v === null || v === undefined || v === "") return DASH;
  var n = Number(v);
  if (!isFinite(n)) return DASH;
  var d = dp === undefined ? 2 : dp;
  return n.toLocaleString("en-IN", { minimumFractionDigits: d, maximumFractionDigits: d });
}
function pct(v){
  if (v === null || v === undefined || !isFinite(Number(v))) return DASH;
  return (Number(v) > 0 ? "+" : "") + num(v, 2) + "%";
}
function signClass(v){
  if (v === null || v === undefined || !isFinite(Number(v))) return "flat";
  return Number(v) > 0 ? "up" : (Number(v) < 0 ? "down" : "flat");
}
function fmtIST(iso){
  if (!iso) return DASH;
  var d = new Date(iso);
  if (isNaN(d.getTime())) return String(iso);
  return d.toLocaleString("en-IN", {
    timeZone: "Asia/Kolkata", day: "2-digit", month: "short",
    hour: "2-digit", minute: "2-digit", hour12: false
  }) + " IST";
}
function minsSince(iso){
  if (!iso) return null;
  var d = new Date(iso);
  return isNaN(d.getTime()) ? null : (Date.now() - d.getTime()) / 60000;
}
function bust(u){ return u + "?t=" + Date.now(); }

/* Today's date in IST as YYYY-MM-DD. The viewer's machine may be in any
   timezone, so this is derived from the epoch plus the fixed +05:30 offset
   (India has no DST, so the offset is exactly right year-round) rather than
   from local date getters, which would roll over at the wrong moment for a
   reader outside India. */
function todayIST(){
  var d = new Date(Date.now() + 330 * 60000);
  function p(n){ return (n < 10 ? "0" : "") + n; }
  return d.getUTCFullYear() + "-" + p(d.getUTCMonth() + 1) + "-" + p(d.getUTCDate());
}

/* How many trading sessions the published prices are behind, RE-DERIVED NOW.

   data_session.sessions_behind and .stale are computed when the page is built
   and frozen into data.json. They are correct at that instant and decay into a
   false reassurance the moment the market trades again without a rebuild: the
   page goes on saying "prices from <date>" with sessions_behind 0 and no
   banner. That is rule 4's invisible failure applied to the very field whose
   job is to prevent it.

   So the count comes from data_session.sessions_after_latest, the forward
   trading calendar the build emitted from NSE's published holiday list. A
   session counts as missed only once its date is strictly before today in IST
   -- the same convention session_freshness uses at build time, so viewing on
   the build date reproduces the build's own number, and no session is ever
   reported missing before its bhavcopy could have been published.

   The payload's value is a FLOOR, never a ceiling: if the build knew it was
   two sessions behind, this cannot talk that down to zero. Without the forward
   calendar (an older payload) the frozen number is all there is, and
   `verified` says so rather than implying it was checked. */
function sessionLag(){
  var ds = DATA.data_session || {};
  var frozen = (typeof ds.sessions_behind === "number") ? ds.sessions_behind : null;
  var fwd = ds.sessions_after_latest;
  if (!fwd || !fwd.length){
    return { behind: frozen, floor_only: false, verified: false };
  }
  var today = todayIST();
  var n = 0;
  /* ISO dates compare lexicographically in date order, so a string compare is
     exact here and needs no parsing. */
  for (var i = 0; i < fwd.length; i++){ if (fwd[i] < today) n += 1; }
  var behind = (frozen === null) ? n : Math.max(frozen, n);
  return {
    behind: behind,
    /* The calendar is finite. Once every date in it has passed, the true count
       may be higher and the number can only be reported as a lower bound. */
    floor_only: n >= fwd.length,
    verified: true
  };
}

/* ---------------- load ---------------- */
function boot(){
  fetch(bust("./data.json"), { cache: "no-store" })
    .then(function(r){
      if (!r.ok) throw new Error("data.json returned HTTP " + r.status);
      return r.json();
    })
    .then(function(d){
      DATA = d;
      return Promise.all([
        fetch(bust("./news.json"), { cache: "no-store" })
          .then(function(r){ return r.ok ? r.json() : null; }).catch(function(){ return null; }),
        /* Present only on the operator's own machine. Absent is normal and
           silent, so the quantity column simply does not appear. */
        fetch(bust("./data.private.json"), { cache: "no-store" })
          .then(function(r){ return r.ok ? r.json() : null; }).catch(function(){ return null; }),
        /* Index and derivatives. Absent is survivable - the section says to
           run src.index_view rather than taking the whole page down with it.
           data.json remains the only payload the page cannot render without. */
        fetch(bust("./index_view.json"), { cache: "no-store" })
          .then(function(r){ return r.ok ? r.json() : null; }).catch(function(){ return null; })
      ]);
    })
    .then(function(res){
      NEWS = res[0]; PRIV = res[1]; IDX = res[2];
      mode = pickMode();
      render();
    })
    .catch(function(e){
      var box = el("div", "err");
      box.appendChild(el("strong", null, "Could not load the report. "));
      box.appendChild(document.createTextNode(
        e.message + " If this is the published page, data.json may be missing " +
        "from the deploy. Locally, run: python -m src.scan"));
      $("fatal").appendChild(box);
    });
}

function pickMode(){
  var tt = DATA.trade_types || {};
  for (var i = 0; i < MODES.length; i++){
    var k = MODES[i].key;
    if (tt[k] && (tt[k].candidates || []).length) return k;
  }
  for (var j = 0; j < MODES.length; j++){
    var k2 = MODES[j].key;
    if ((DATA.shortlist || {})[k2] && DATA.shortlist[k2].length) return k2;
  }
  return "positional";
}

/* ---------------- header ---------------- */
function renderStamps(){
  var box = $("stamps"); box.innerHTML = "";
  function add(label, value, cls){
    var s = el("span", "stamp" + (cls ? " " + cls : ""));
    s.appendChild(document.createTextNode(label + " "));
    s.appendChild(el("b", null, value));
    box.appendChild(s);
  }
  var age = minsSince(DATA.generated_at);
  var stale = age !== null && age > 24 * 60;
  add("computed", fmtIST(DATA.generated_at), stale ? "bad" : "");
  if (stale) add("STALE", Math.floor(age / 60) + " hours old", "bad");

  /* The session the prices came from, stated separately from the run time.
     "computed 12 Nov 11:27" above reads as today's prices; it is not. Every
     close on this page is that session's close. Without this stamp a reader
     has no way to tell, which is the invisible failure CLAUDE.md rule 4 is
     written against. */
  var ds = DATA.data_session || {};
  if (ds.latest){
    /* Recomputed at view time, not read from the payload: see sessionLag. */
    var lag = sessionLag();
    var behindNow = lag.behind !== null && lag.behind > 0;
    add("prices from", ds.latest + " close", behindNow ? "bad" : "");
    if (behindNow){
      add("DATA BEHIND",
          (lag.floor_only ? "at least " : "") + String(lag.behind) + " session(s)",
          "bad");
    }
  } else {
    add("prices from", "not recorded", "warn");
  }

  if (NEWS){
    var na = minsSince(NEWS.fetched_at);
    add("news", fmtIST(NEWS.fetched_at), (na !== null && na > 60) ? "warn" : "");
  } else {
    add("news", "unavailable", "warn");
  }

  var u = DATA.universe || {};
  add("scanned", String(u.symbols_scanned === undefined ? DASH : u.symbols_scanned));

  var sc = DATA.scorecard || {};
  if (sc.status === "live"){
    add("hit rate", num(sc.hit_rate_pct, 1) + "%");
    add("net expectancy", num(sc.net_expectancy, 2) + "%");
  } else {
    add("track record", String(sc.calls_logged === undefined ? DASH : sc.calls_logged) + " calls logged");
  }

  var f = DATA.fundamentals || {};
  if (!f.available) add("fundamentals", "unavailable", "warn");
}

function renderModes(){
  var box = $("modes"); box.innerHTML = "";
  MODES.forEach(function(m){
    var tt = (DATA.trade_types || {})[m.key] || {};
    var n = (tt.candidates || []).length;
    var sl = ((DATA.shortlist || {})[m.key] || {});
    var sn = ((sl[driver]) || []).length;
    var b = el("button", "mode");
    b.type = "button";
    b.setAttribute("aria-pressed", m.key === mode ? "true" : "false");
    b.appendChild(el("span", "mt", m.title));
    b.appendChild(el("span", "ms", n + " trade-ready · " + sn + " shortlisted"));
    b.title = m.sub;
    b.onclick = function(){ mode = m.key; render(); };
    box.appendChild(b);
  });
}

function renderDrivers(){
  var box = $("drivers"); box.innerHTML = "";
  var sl = ((DATA.shortlist || {})[mode]) || {};
  DRIVERS.forEach(function(d){
    var n = (sl[d.key] || []).length;
    var b = el("button", "mode sm");
    b.type = "button";
    b.setAttribute("aria-pressed", d.key === driver ? "true" : "false");
    b.appendChild(el("span", "mt", d.title));
    b.appendChild(el("span", "ms", n + " names"));
    b.title = d.sub;
    b.onclick = function(){ driver = d.key; render(); };
    box.appendChild(b);
  });
}

/* ---------------- tables ---------------- */
function flagTag(f){
  var cls = "tag " + f.kind;
  if (f.kind === "move") cls = "tag " + (String(f.label).charAt(0) === "-" ? "move-down" : "move-up");
  var t = el("span", cls, f.label);
  t.title = f.detail || "";
  return t;
}

function headerRow(cols){
  var tr = el("tr");
  cols.forEach(function(c){ tr.appendChild(el("th", null, c)); });
  var thead = el("thead"); thead.appendChild(tr);

function shortGate(reason){
  var s = String(reason);

  /* "the feed is down so this could not be checked" is NOT "this failed the
     check", and collapsing the two publishes a fact the page does not know.
     scan.py words it carefully -- "circuit-lock feed unavailable - gate cannot
     be verified, so the candidate is held back" -- and the keyword matches
     below then reduced that to "circuit locked", flatly asserting that a stock
     had hit its price band when nothing had established it. A stock down 6.9%
     was labelled circuit locked on a published page that way.

     Every held-back reason scan.py writes carries "cannot be verified", and no
     missing-indicator reason does, so that is the discriminator. It has to be
     tested BEFORE the topic keywords, because the held-back strings contain
     the same words ("circuit", "results") as the real rejections. */
  if (s.indexOf("cannot be verified") >= 0){
    if (s.indexOf("circuit") >= 0) return "circuit feed down";
    if (s.indexOf("ASM") >= 0 || s.indexOf("surveillance") >= 0) return "surveillance feed down";
    if (s.indexOf("results") >= 0 || s.indexOf("calendar") >= 0) return "results feed down";
    if (s.indexOf("ban") >= 0) return "ban-list feed down";
    return "gate feed down";
  }
  /* An indicator that could not be computed is also not a gate the symbol
     failed: "20 EMA unavailable" was being labelled "trend filter" below. */
  if (s.indexOf("unavailable") >= 0) return "indicator missing";

  if (s.indexOf("R:R") >= 0 || s.indexOf("reward") >= 0) return "reward to risk";
  if (s.indexOf("turnover") >= 0) return "liquidity";
  if (s.indexOf("results") >= 0) return "results blackout";
  if (s.indexOf("surveillance") >= 0) return "surveillance list";
  if (s.indexOf("circuit") >= 0) return "circuit locked";
  if (s.indexOf("EMA") >= 0) return "trend filter";
  if (s.indexOf("sizing") >= 0) return "sizing";
  if (s.indexOf("corporate action") >= 0) return "unadjusted split";
  if (s.indexOf("no 1h") >= 0 || s.indexOf("no 15m") >= 0 || s.indexOf("no 5m") >= 0) return "no intraday data";
  return s.length > 34 ? s.slice(0, 32) + "…" : s;
}

/* Rule 4 requires staleness stated PROMINENTLY, not only as a badge in a row
   of badges. A reader who has already acted on a level will not re-read the
   stamps. */
function renderBanner(){
  var b = $("banner"); b.innerHTML = "";

  /* A gate that could not be EVALUATED changes what the whole page means, so
     it belongs here rather than only inside the collapsed "why so few passed"
     disclosure, where it was the one place this was stated. With three feeds
     down the trade-ready section reads "Nothing cleared every gate for this
     horizon. 892 symbols were rejected", which a reader takes as "the market
     offered nothing today" when the truth is that three of the gates were
     never checked at all. Same distinction shortGate() has to make per row,
     made once for the page. */
  var gf = DATA.gate_feeds_unavailable || {};
  var feeds = Object.keys(gf);
  if (feeds.length){
    b.appendChild(el("div", "note bad",
      "GATES NOT FULLY APPLIED — " + feeds.length + " gate-critical feed(s) "
      + "could not be collected (" + feeds.join(", ") + "). Candidates needing "
      + "them were held back rather than passed, so a short trade-ready list "
      + "here reflects a data outage, not an absence of opportunities. "
      + "Nothing below has been checked against those gates."));
  }

  var ds = DATA.data_session || {};
  if (!ds.latest) return;

  var lag = sessionLag();
  if (!(lag.behind > 0)) return;

  /* The message is written from the RE-DERIVED count, not from ds.reason.
     ds.reason is a sentence composed at build time and it understates as soon
     as more sessions pass, so quoting it here would reintroduce the frozen
     number the banner exists to catch. The build's own count is still worth
     stating, because the two causes call for different action: a build that
     was ALREADY behind means collection failed, while a build that was fine
     means only that nothing has been rebuilt since. */
  var frozen = (typeof ds.sessions_behind === "number") ? ds.sessions_behind : 0;
  var msg = "STALE DATA — the newest price data is from " + ds.latest + ", "
    + (lag.floor_only ? "at least " : "")
    + lag.behind + " completed trading session(s) ago. Every close, indicator "
    + "and level on this page is that session's, not today's.";
  msg += frozen > 0
    ? " The build itself was already behind, so collection may have failed."
    : " The page has not been rebuilt since the market last traded.";
  b.appendChild(el("div", "note bad", msg));
}

/* ---------------- index & derivatives ---------------- */
/* Every figure below arrives from ./index_view.json, computed by
   src/index_view.py and src/derivatives.py. Nothing here decides anything:
   the verdict is the rule-based one from report-spec section 3, the zones are
   section 4's, the gap plans are section 6's, and the buildup state is the
   price/open-interest cross. No direction is forecast. */
var idxKey = null;

var MTF_ROWS = [
  ["close",            function(s){ return num(s.close); }],
  ["9 EMA",            function(s){ return num(s.ema9); }],
  ["20 EMA",           function(s){ return num(s.ema20); }],
  ["50 EMA",           function(s){ return num(s.ema50); }],
  ["200 EMA",          function(s){ return num(s.ema200); }],
  ["RSI(14) Wilder",   function(s){ return num(s.rsi14, 1); }],
  ["MACD histogram",   function(s){ return num(s.macd_hist); }],
  ["MACD prev hist",   function(s){ return num(s.macd_hist_prev); }],
  ["Stochastic %K",    function(s){ return num(s.stoch_k, 1); }],
  ["Stochastic %D",    function(s){ return num(s.stoch_d, 1); }],
  ["Bollinger upper",  function(s){ return num(s.bb_upper); }],
  ["Bollinger lower",  function(s){ return num(s.bb_lower); }],
  ["BB bandwidth",     function(s){ return num(s.bb_bandwidth, 2); }],
  ["BB squeeze",       function(s){ return s.squeeze === null || s.squeeze === undefined
                                      ? DASH : (s.squeeze ? "yes" : "no"); }],
  ["ATR(14)",          function(s){ return num(s.atr14); }],
  ["volume",           function(s){ return num(s.volume, 0); }],
  ["volume vs 10-bar", function(s){ return s.volume_ratio === null ? DASH
                                      : num(s.volume_ratio, 2) + "x"; }],
  ["volume spike",     function(s){ return s.volume_spike === null
                                      || s.volume_spike === undefined ? DASH
                                      : (s.volume_spike ? "yes" : "no"); }],
  ["bars",             function(s){ return num(s.bars, 0); }]
];

function idxKeys(){
  var insts = (IDX && IDX.instruments) || {};
  var all = Object.keys(insts);
  /* Configured order, not alphabetical: the payload is written sorted, so
     without this the page defaults to whichever key sorts first. */
  var order = (IDX && IDX.order) || [];
  var out = [];
  order.forEach(function(k){ if (insts[k]) out.push(k); });
  all.forEach(function(k){ if (out.indexOf(k) < 0) out.push(k); });
  return out;
}

function pickIdx(){
  var keys = idxKeys();
  if (!keys.length) return null;
  if (idxKey && keys.indexOf(idxKey) >= 0) return idxKey;
  var insts = IDX.instruments;
  for (var i = 0; i < keys.length; i++){
    if (insts[keys[i]] && insts[keys[i]].available) return keys[i];
  }
  return keys[0];
}

function renderIndexTabs(){
  var box = $("idx-tabs"); box.innerHTML = "";
  var keys = idxKeys();
  if (keys.length < 2) return;
  keys.forEach(function(k){
    var inst = IDX.instruments[k] || {};
    var b = el("button", "mode sm");
    b.type = "button";
    b.setAttribute("aria-pressed", k === idxKey ? "true" : "false");
    b.appendChild(el("span", "mt", inst.display || k));
    var v = ((inst.verdicts || {})["1d"] || {}).label;
    b.appendChild(el("span", "ms", inst.available
      ? (v || DASH).toLowerCase().replace(/_/g, " ")
      : "unavailable"));
    b.onclick = function(){ idxKey = k; renderIndex(); };
    box.appendChild(b);
  });
}

function buildupTag(b){
  if (!b) return el("span", "tag nostate", "no buildup reading");
  if (!b.state) return el("span", "tag nostate", "no state");
  return el("span", "tag bu", b.state.replace(/_/g, " "));
}

function renderIndex(){
  var sub = $("idx-sub"), body = $("idx-body"), count = $("idx-count");
  body.innerHTML = ""; sub.textContent = ""; count.textContent = "";

  /* index_view.json absent is a legitimate state - the operator may not have
     run it yet. The section explains itself IN THE BODY rather than leaving
     an empty panel, so "nothing here" always carries a reason and the render
     check never passes over a silently blank section. */
  if (!IDX){
    sub.textContent = "Not computed yet.";
    $("idx-tabs").innerHTML = "";
    body.appendChild(el("p", "note",
      "dist/index_view.json is not present, so there is nothing to show for "
      + "NIFTY or BANK NIFTY. Run: python -m src.index_view"));
    return;
  }

  idxKey = pickIdx();
  renderIndexTabs();
  var inst = (IDX.instruments || {})[idxKey];
  if (!inst){
    sub.textContent = "No instruments in the payload.";
    body.appendChild(el("p", "note bad",
      "index_view.json carries no instruments. Check "
      + "config/derivatives.yaml index_view.instruments."));
    return;
  }
  if (!inst.available){
    sub.textContent = "This instrument has no stored history.";
    body.appendChild(el("p", "note bad",
      inst.reason || "No stored history for this instrument."));
    return;
  }

  count.textContent = num(inst.sessions, 0) + " sessions";
  sub.textContent = "Computed from stored index OHLC and end-of-day open "
    + "interest. The verdict is rule-based, the levels are measured, and no "
    + "direction is forecast.";

  /* headline line */
  var line = el("div", "idxline");
  function stat(label, value, cls){
    var w = el("div");
    var v = el("div", "idxval" + (cls ? " " + cls : ""), value);
    w.appendChild(v);
    w.appendChild(el("div", "idxlab", label));
    line.appendChild(w);
  }
  var v1d = (inst.verdicts || {})["1d"] || {};
  var v1w = (inst.verdicts || {})["1w"] || {};
  stat("close, " + (inst.as_of || DASH), num(inst.last_close));
  stat("daily verdict (score " + num(v1d.score, 0) + ")",
       (v1d.label || DASH).replace(/_/g, " "));
  stat("weekly verdict", (v1w.label || DASH).replace(/_/g, " "));
  body.appendChild(line);

  var dv = inst.derivatives || {};
  var bl = dv.buildup_latest;
  var tags = el("div", "tags");
  tags.appendChild(buildupTag(bl));
  var opt = dv.options || {};
  if (opt.pcr_oi !== undefined && opt.pcr_oi !== null){
    tags.appendChild(el("span", "tag", "PCR " + num(opt.pcr_oi, 2)));
  }
  var ph = dv.pcr_history || {};
  if (ph.available){
    tags.appendChild(el("span", "tag", num(ph.percentile, 0)
      + "th percentile of " + num(ph.observations, 0) + " sessions"));
  }
  if (inst.valuation && inst.valuation.pe){
    tags.appendChild(el("span", "tag", "P/E " + num(inst.valuation.pe, 2)));
  }
  body.appendChild(tags);

  if (inst.volume_note) body.appendChild(el("p", "note", inst.volume_note));

  /* multi-timeframe table */
  var tfs = Object.keys(inst.timeframes || {});
  if (tfs.length){
    var det = el("details");
    det.appendChild(el("summary", null,
      "Multi-timeframe indicators (" + tfs.join(", ") + ")"));
    var dbody = el("div", "dbody");
    var sh = tableShell(["indicator"].concat(tfs));
    sh.wrap.firstChild.className = "mtf";
    MTF_ROWS.forEach(function(row){
      var tr = el("tr");
      tr.appendChild(el("td", "ind", row[0]));
      tfs.forEach(function(tf){
        tr.appendChild(el("td", "num", row[1](inst.timeframes[tf] || {})));
      });
      sh.body.appendChild(tr);
    });
    dbody.appendChild(sh.wrap);
    if (inst.confluence_note)
      dbody.appendChild(el("p", "note", inst.confluence_note));
    tfs.forEach(function(tf){
      var vd = (inst.verdicts || {})[tf];
      if (!vd || !vd.reasons) return;
      var c = el("div", "dcard");
      c.appendChild(el("h3", null, tf + " verdict: "
        + (vd.label || DASH).replace(/_/g, " ")));
      var ul = el("div", "rlist");
      vd.reasons.forEach(function(r){ ul.appendChild(el("div", "rrow", r)); });
      c.appendChild(ul);
      dbody.appendChild(c);
    });
    det.appendChild(dbody);
    body.appendChild(det);
  }

  /* zones, expected range, gap plans */
  var det2 = el("details");
  det2.appendChild(el("summary", null, "Levels, expected range and gap plans"));
  var d2 = el("div", "dbody");
  var grid = el("div", "dgrid");

  var z = inst.zones || {};
  /* NOT titled "measured". When target_1 falls back to twice the risk the
     heading would contradict the card's own t1 source line, and a heading is
     read first and believed longest. */
  grid.appendChild(kvCard("Levels", [
    ["trigger", num(z.trigger_entry)],
    ["hard stop", num(z.hard_stop)],
    ["risk/unit", num(z.risk_per_share)],
    ["target 1", num(z.target_1)],
    ["t1 source", z.target_1_source || DASH],
    ["target 2", num(z.target_2)],
    ["R:R to t1", num(z.rr_to_t1, 3)],
    ["buy zone", z.buy_zone ? num(z.buy_zone[0]) + " - " + num(z.buy_zone[1]) : DASH],
    ["strong buy", (z.strong_buy_zone || []).map(function(x){ return num(x); }).join(", ") || DASH],
    ["selling zone", (z.selling_zone || []).map(function(x){ return num(x); }).join(", ") || DASH]
  ]));

  var er = inst.expected_range || {};
  if (er.available){
    var erc = el("div", "dcard");
    erc.appendChild(el("h3", null, "Expected range, with its hit rate"));
    var hb = el("div", "hitbar");
    Object.keys(er.bands).forEach(function(k){
      var b = er.bands[k];
      hb.appendChild(el("div", "num", num(b.low) + " - " + num(b.high)));
      hb.appendChild(el("div", null, b.multiple + "x ATR: next close inside "
        + num(b.close_inside_pct, 1) + "%, whole next session inside "
        + num(b.range_inside_pct, 1) + "% (" + num(b.observations, 0)
        + " sessions)"));
    });
    erc.appendChild(hb);
    erc.appendChild(el("p", "note", er.note || ""));
    grid.appendChild(erc);
  }

  var gm = inst.gap_matrix || {};
  if (gm.available){
    var gu = gm.gap_up || {};
    grid.appendChild(kvCard("If it opens up", [
      ["do not chase above", num(gu.do_not_chase_above)],
      ["retest zone", gu.retest_entry_zone
        ? num(gu.retest_entry_zone[0]) + " - " + num(gu.retest_entry_zone[1]) : DASH],
      ["invalidation", num(gu.invalidation)],
      ["rule", gu.rule || DASH]
    ]));
    var gd = gm.gap_down || {};
    grid.appendChild(gd.available === false
      ? kvCard("If it opens down", [["unavailable", gd.reason || DASH]])
      : kvCard("If it opens down", [
          ["reversal watch", gd.reversal_watch_zone
            ? num(gd.reversal_watch_zone[0]) + " - " + num(gd.reversal_watch_zone[1]) : DASH],
          ["trigger", gd.reversal_trigger || DASH],
          ["breakdown below", num(gd.breakdown_confirm_below)],
          ["rule", gd.rule || DASH]
        ]));
  }
  /* An assumed target must never read as a measured one. When there is no
     real level above the trigger the R:R is 2.0 by construction, and 2.0
     looks like the best number on the panel. Say so before the card. */
  if (z.trigger_entry !== null && z.trigger_entry !== undefined
      && z.rr_is_measured === false){
    d2.appendChild(el("p", "note bad",
      "The R:R below is NOT measured. There is no real level above the "
      + "trigger, so target 1 falls back to twice the risk and the ratio is "
      + "2.0 by construction - it carries no information. Source: "
      + (z.target_1_source || DASH) + "."));
  }
  if (z.sizing_omitted){
    d2.appendChild(el("p", "note", z.sizing_omitted_reason || ""));
  }
  d2.appendChild(grid);
  det2.appendChild(d2);
  body.appendChild(det2);

  /* derivatives */
  var det3 = el("details");
  det3.appendChild(el("summary", null,
    "Open interest, long/short buildup and the option chain"));
  var d3 = el("div", "dbody");
  if (!dv.available){
    d3.appendChild(el("p", "note", dv.reason || "No F&O data on disk."));
  } else {
    var g3 = el("div", "dgrid");
    var f = dv.futures_latest || {};
    g3.appendChild(kvCard("Near-month future", [
      ["expiry", f.near_expiry || DASH],
      ["close", num(f.close)],
      ["underlying", num(f.underlying)],
      ["open interest", num(f.oi, 0)],
      ["change in OI", num(f.oi_change_reported, 0)],
      ["volume", num(f.volume, 0)],
      ["lot size", num(f.lot_size, 0)],
      ["all expiries OI", num((f.all_expiries || {}).oi, 0)]
    ]));
    g3.appendChild(kvCard("Buildup, latest session", bl ? [
      ["state", bl.state ? bl.state.replace(/_/g, " ") : "none"],
      ["means", bl.meaning || DASH],
      ["price change", pct(bl.price_change_pct)],
      ["OI change", pct(bl.oi_change_pct)],
      ["why", bl.reason || DASH]
    ] : [["state", "no reading"]]));

    var counts = dv.buildup_counts || {};
    var ck = Object.keys(counts);
    if (ck.length){
      g3.appendChild(kvCard("Buildup over " + num(dv.sessions_on_disk, 0)
        + " sessions", ck.map(function(k){
          return [k.replace(/_/g, " "), num(counts[k], 0)];
        })));
    }

    if (opt.expiry){
      g3.appendChild(kvCard("Option chain, " + opt.expiry, [
        ["PCR by OI", num(opt.pcr_oi, 3)],
        ["PCR by volume", num(opt.pcr_volume, 3)],
        ["total CE OI", num(opt.total_oi_ce, 0)],
        ["total PE OI", num(opt.total_oi_pe, 0)],
        ["CE strikes", num(opt.strikes_ce, 0)],
        ["PE strikes", num(opt.strikes_pe, 0)]
      ]));
      var w = opt.walls || {};
      g3.appendChild(w.available
        ? kvCard("Heaviest open interest", [
            ["call wall", num(w.call_wall, 0)],
            ["its OI", num(w.call_wall_oi, 0)],
            ["put wall", num(w.put_wall, 0)],
            ["its OI", num(w.put_wall_oi, 0)],
            ["window", w.strike_window
              ? num(w.strike_window[0]) + " - " + num(w.strike_window[1]) : DASH]
          ])
        : kvCard("Heaviest open interest", [["unavailable", w.reason || DASH]]));
    }
    if (ph.available){
      g3.appendChild(kvCard("PCR in its own distribution", [
        ["latest", num(ph.latest_pcr_oi, 3)],
        ["percentile", num(ph.percentile, 1) + "%"],
        ["min", num(ph.min, 3)],
        ["median", num(ph.median, 3)],
        ["max", num(ph.max, 3)],
        ["observations", num(ph.observations, 0)]
      ]));
    } else if (ph.reason){
      g3.appendChild(kvCard("PCR in its own distribution",
        [["unavailable", ph.reason]]));
    }
    d3.appendChild(g3);
    ((opt.walls || {}).flags || []).forEach(function(fl){
      d3.appendChild(el("p", "note bad", fl));
    });
    if (opt.pcr_note) d3.appendChild(el("p", "note", opt.pcr_note));
    if ((opt.walls || {}).note) d3.appendChild(el("p", "note", opt.walls.note));
    if (dv.source) d3.appendChild(el("p", "note", dv.source));
  }
  det3.appendChild(d3);
  body.appendChild(det3);

  /* what is NOT available, and why - stated, never approximated */
  var un = inst.unavailable_timeframes || {};
  var uk = Object.keys(un);
  if (uk.length){
    var det4 = el("details");
    det4.appendChild(el("summary", null,
      "Timeframes not available (" + uk.length + ")"));
    var d4 = el("div", "dbody");
    /* Grouped by reason. Three timeframes blocked by the same missing feed
       printed the same paragraph three times, which buries the one fact it
       is trying to convey. */
    var byReason = {};
    uk.forEach(function(tf){
      var r = un[tf];
      if (!byReason[r]) byReason[r] = [];
      byReason[r].push(tf);
    });
    Object.keys(byReason).forEach(function(r){
      d4.appendChild(el("p", "note bad", byReason[r].join(", ") + " - " + r));
    });
    det4.appendChild(d4);
    body.appendChild(det4);
  }

  if (IDX.rule_1_note) body.appendChild(el("p", "note", IDX.rule_1_note));
}

function render(){
  if (!DATA) return;
  renderBanner();
  renderStamps();
  renderModes();
  renderDrivers();
  renderIndex();
  renderGated();
  renderShortlist();
  renderWhy();
  renderDisclaimer();
}

boot();
</script>
</body>
</html>
