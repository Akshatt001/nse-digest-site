<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="claude:viewport-fit-sides" content="cover">
<meta name="robots" content="noindex, nofollow">
<title>NSE Digest</title>
<style>
/* Layout: one column, one view. Sticky header holds the only control; the
   gated list sits above the shortlist so the stronger claim is read first. */
:root{
  color-scheme: light;
  --bg:#ffffff;
  --surface:#f6f7fa;
  --surface-2:#eef1f6;
  --line:#dfe3ea;
  --line-strong:#c6ccd8;
  --ink:#12151b;
  --ink-2:#4b5264;
  --ink-3:#79818f;
  --accent:#1b43c8;
  --accent-soft:#eaeeff;
  --up:#0a6d3c;
  --up-soft:#e7f4ec;
  --down:#b32626;
  --down-soft:#fdeceb;
  --warn:#8a5000;
  --warn-soft:#fff3e0;
  /* System stacks only. V3's stack rule is explicit: no CDN, no external
     fonts. Any webfont here would be a silent dependency on a third party
     for a page that must render identically offline. */
  --sans:system-ui,-apple-system,"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif;
  --mono:ui-monospace,SFMono-Regular,"SF Mono",Menlo,Consolas,"Liberation Mono",monospace;
  --r:6px;
}
*{box-sizing:border-box}
html,body{margin:0;padding:0}
body{
  background:var(--bg); color:var(--ink);
  font-family:var(--sans); font-size:15px; line-height:1.5;
  -webkit-text-size-adjust:100%;
}
.wrap{
  max-width:1040px; margin:0 auto;
  padding-left:max(16px, env(safe-area-inset-left, 0px));
  padding-right:max(16px, env(safe-area-inset-right, 0px));
}
a{color:var(--accent)}
a:hover{text-decoration:underline}
:focus-visible{outline:2px solid var(--accent); outline-offset:2px}
.num{font-family:var(--mono); font-variant-numeric:tabular-nums}

/* ---------- header ---------- */
body::before{
  content:""; position:fixed; inset:0 0 auto;
  height:env(safe-area-inset-top, 0px); z-index:10; background:var(--bg);
}
header{
  position:sticky; top:env(safe-area-inset-top, 0px); z-index:9;
  background:var(--bg); border-bottom:1px solid var(--line);
}
.masthead{display:flex; flex-wrap:wrap; align-items:baseline; gap:6px 14px; padding-block:14px 10px}
h1{margin:0; font-size:19px; font-weight:600; letter-spacing:-.02em}
.tagline{color:var(--ink-3); font-size:13px}
.stamps{display:flex; flex-wrap:wrap; gap:6px; padding-bottom:12px}
.stamp{
  font-family:var(--mono); font-size:11px; padding:3px 8px;
  border:1px solid var(--line); border-radius:var(--r);
  background:var(--surface); color:var(--ink-2); white-space:nowrap;
}
.stamp b{color:var(--ink); font-weight:500}
.stamp.warn{background:var(--warn-soft); border-color:#f0d9ae; color:var(--warn)}
.stamp.warn b{color:var(--warn)}
.stamp.bad{background:var(--down-soft); border-color:#f3c9c6; color:var(--down)}
.stamp.bad b{color:var(--down)}

/* ---------- mode selector ---------- */
.modes{display:flex; gap:8px; padding-bottom:14px; flex-wrap:wrap}
.mode{
  flex:1 1 150px; min-width:0; text-align:left; cursor:pointer;
  background:var(--surface); border:1px solid var(--line);
  border-radius:var(--r); padding:10px 12px; font:inherit; color:var(--ink-2);
}
.mode:hover{border-color:var(--line-strong)}
.mode[aria-pressed="true"]{
  background:var(--accent-soft); border-color:var(--accent); color:var(--ink);
}
.mode .mt{display:block; font-weight:600; font-size:14px; color:var(--ink)}
.mode .ms{display:block; font-size:12px; color:var(--ink-3); margin-top:1px}

/* ---------- sections ---------- */
section{padding-block:18px}
.sechead{display:flex; flex-wrap:wrap; align-items:baseline; gap:4px 12px; margin-bottom:4px}
h2{margin:0; font-size:15px; font-weight:600; letter-spacing:-.01em}
.count{font-family:var(--mono); font-size:12px; color:var(--ink-3)}
.sub{color:var(--ink-2); font-size:13px; margin:0 0 12px; max-width:68ch}

/* ---------- table ---------- */
.tablewrap{overflow-x:auto; border:1px solid var(--line); border-radius:var(--r)}
table{border-collapse:collapse; width:100%; font-size:14px}
th,td{padding:9px 11px; text-align:right; white-space:nowrap}
th:first-child,td:first-child{text-align:left}
th:last-child,td:last-child{text-align:left}
thead th{
  background:var(--surface); color:var(--ink-3); font-size:11px;
  font-weight:500; text-transform:uppercase; letter-spacing:.06em;
  border-bottom:1px solid var(--line);
}
tbody tr{border-top:1px solid var(--line); cursor:pointer}
tbody tr:hover{background:var(--surface)}
tbody tr.open{background:var(--accent-soft)}
.sym{font-weight:600}
.up{color:var(--up)} .down{color:var(--down)} .flat{color:var(--ink-3)}
tr.detail{cursor:default}
tr.detail>td{background:var(--surface); white-space:normal; text-align:left; padding:14px 11px}

/* ---------- tags ---------- */
.tag{
  display:inline-block; font-size:11px; font-family:var(--mono);
  padding:2px 7px; border-radius:var(--r); margin:2px 3px 2px 0;
  border:1px solid var(--line); background:var(--bg); color:var(--ink-2);
}
.tag.move-up{background:var(--up-soft); border-color:#bfe3cd; color:var(--up)}
.tag.move-down{background:var(--down-soft); border-color:#f3c9c6; color:var(--down)}
.tag.volume{background:var(--accent-soft); border-color:#c3cefc; color:var(--accent)}
.tag.breakout{background:var(--warn-soft); border-color:#f0d9ae; color:var(--warn)}
.tag.squeeze,.tag.result{background:var(--surface-2)}
.tag.v-BULLISH{background:var(--up-soft); border-color:#bfe3cd; color:var(--up)}
.tag.v-BEARISH{background:var(--down-soft); border-color:#f3c9c6; color:var(--down)}

/* ---------- detail ---------- */
.dgrid{display:grid; gap:14px; grid-template-columns:repeat(auto-fit,minmax(240px,1fr))}
.dcard{min-width:0}
.dcard h3{
  margin:0 0 7px; font-size:11px; font-weight:500; color:var(--ink-3);
  text-transform:uppercase; letter-spacing:.06em;
}
.kv{display:grid; grid-template-columns:auto 1fr; gap:3px 12px; font-size:13px; margin:0}
.kv dt{color:var(--ink-3); font-family:var(--mono)}
.kv dd{margin:0; font-family:var(--mono); font-variant-numeric:tabular-nums}
.note{font-size:13px; color:var(--ink-2); margin:4px 0; padding-left:10px; border-left:2px solid var(--line)}
.note.bad{border-left-color:var(--down)}
.nitem{padding:7px 0; border-top:1px solid var(--line)}
.nitem:first-of-type{border-top:0}
.nmeta{font-family:var(--mono); font-size:11px; color:var(--ink-3); margin-top:2px}

/* ---------- callouts ---------- */
.callout{
  border:1px solid var(--line); border-left:3px solid var(--accent);
  border-radius:var(--r); background:var(--surface); padding:12px 14px;
  font-size:13px; color:var(--ink-2);
}
.callout.warn{border-left-color:var(--warn); background:var(--warn-soft)}
.callout b{color:var(--ink); font-weight:600}
.callout p{margin:0 0 6px}
.callout p:last-child{margin:0}
.callout code{font-family:var(--mono); font-size:12px; background:var(--bg);
  border:1px solid var(--line); border-radius:3px; padding:1px 4px}
details{border:1px solid var(--line); border-radius:var(--r); background:var(--bg)}
summary{padding:10px 12px; cursor:pointer; font-size:13px; color:var(--ink-2)}
summary:hover{color:var(--ink)}
details[open] summary{border-bottom:1px solid var(--line); color:var(--ink)}
.dbody{padding:12px}
.rlist{display:grid; gap:4px; font-size:13px}
.rrow{display:flex; gap:10px; align-items:baseline}
.rn{font-family:var(--mono); color:var(--ink-3); min-width:4ch; text-align:right}
.empty{padding:20px 12px; text-align:center; color:var(--ink-3); font-size:14px}
.err{border:1px solid var(--down); border-left:3px solid var(--down);
  border-radius:var(--r); background:var(--down-soft); color:var(--down);
  padding:12px 14px; margin:16px 0; font-size:14px}

footer{border-top:1px solid var(--line); margin-top:10px}
.disc{padding-block:14px 22px; font-size:12px; color:var(--ink-3); max-width:72ch}

@media (max-width:620px){
  body{font-size:14px}
  th,td{padding:8px 9px; font-size:13px}
  .mode{flex:1 1 100%}
}
@media (prefers-reduced-motion:reduce){*{transition:none!important; animation:none!important}}
</style>
</head>
<body>

<header>
  <div class="wrap">
    <div class="masthead">
      <h1>NSE Digest</h1>
      <span class="tagline">conditional levels from NSE data &mdash; not advice</span>
    </div>
    <div class="stamps" id="stamps"></div>
    <div class="modes" id="modes" role="group" aria-label="Horizon"></div>
  </div>
</header>

<main class="wrap">
  <div id="fatal"></div>

  <section id="sec-gated">
    <div class="sechead">
      <h2>Trade-ready</h2>
      <span class="count" id="gated-count"></span>
    </div>
    <p class="sub" id="gated-sub"></p>
    <div id="gated-body"></div>
  </section>

  <section id="sec-short">
    <div class="sechead">
      <h2>Shortlist to research</h2>
      <span class="count" id="short-count"></span>
    </div>
    <p class="sub" id="short-sub"></p>
    <div id="short-body"></div>
  </section>

  <section id="sec-why">
    <details id="why">
      <summary id="why-summary">Why so few passed</summary>
      <div class="dbody">
        <p class="sub" id="why-sub"></p>
        <div class="rlist" id="why-body"></div>
      </div>
    </details>
  </section>
</main>

<footer>
  <div class="wrap disc" id="disclaimer"></div>
</footer>

<script>
"use strict";
/* Everything displayed comes from ./data.json and ./news.json, fetched at
   runtime with relative paths so the file works from a Pages subpath, a local
   server, or published alongside its data. */
var DATA = null, NEWS = null, PRIV = null;
var mode = null;

var MODES = [
  { key: "intraday",   title: "Intraday",   sub: "same-day, needs broker candles" },
  { key: "positional", title: "Short term", sub: "days to weeks, daily bars" },
  { key: "longterm",   title: "Long term",  sub: "months, daily and weekly" }
];

function $(id){ return document.getElementById(id); }
function el(t, c, txt){
  var n = document.createElement(t);
  if (c) n.className = c;
  if (txt !== undefined && txt !== null) n.textContent = String(txt);
  return n;
}
var DASH = "—";
function num(v, dp){
  if (v === null || v === undefined || v === "") return DASH;
  var n = Number(v);
  if (!isFinite(n)) return DASH;
  var d = dp === undefined ? 2 : dp;
  return n.toLocaleString("en-IN", { minimumFractionDigits: d, maximumFractionDigits: d });
}
function pct(v){
  if (v === null || v === undefined || !isFinite(Number(v))) return DASH;
  return (Number(v) > 0 ? "+" : "") + num(v, 2) + "%";
}
function signClass(v){
  if (v === null || v === undefined || !isFinite(Number(v))) return "flat";
  return Number(v) > 0 ? "up" : (Number(v) < 0 ? "down" : "flat");
}
function fmtIST(iso){
  if (!iso) return DASH;
  var d = new Date(iso);
  if (isNaN(d.getTime())) return String(iso);
  return d.toLocaleString("en-IN", {
    timeZone: "Asia/Kolkata", day: "2-digit", month: "short",
    hour: "2-digit", minute: "2-digit", hour12: false
  }) + " IST";
}
function minsSince(iso){
  if (!iso) return null;
  var d = new Date(iso);
  return isNaN(d.getTime()) ? null : (Date.now() - d.getTime()) / 60000;
}
function bust(u){ return u + "?t=" + Date.now(); }

/* ---------------- load ---------------- */
function boot(){
  fetch(bust("./data.json"), { cache: "no-store" })
    .then(function(r){
      if (!r.ok) throw new Error("data.json returned HTTP " + r.status);
      return r.json();
    })
    .then(function(d){
      DATA = d;
      return Promise.all([
        fetch(bust("./news.json"), { cache: "no-store" })
          .then(function(r){ return r.ok ? r.json() : null; }).catch(function(){ return null; }),
        /* Present only on the operator's own machine. Absent is normal and
           silent, so the quantity column simply does not appear. */
        fetch(bust("./data.private.json"), { cache: "no-store" })
          .then(function(r){ return r.ok ? r.json() : null; }).catch(function(){ return null; })
      ]);
    })
    .then(function(res){
      NEWS = res[0]; PRIV = res[1];
      mode = pickMode();
      render();
    })
    .catch(function(e){
      var box = el("div", "err");
      box.appendChild(el("strong", null, "Could not load the report. "));
      box.appendChild(document.createTextNode(
        e.message + " If this is the published page, data.json may be missing " +
        "from the deploy. Locally, run: python -m src.scan"));
      $("fatal").appendChild(box);
    });
}

function pickMode(){
  var tt = DATA.trade_types || {};
  for (var i = 0; i < MODES.length; i++){
    var k = MODES[i].key;
    if (tt[k] && (tt[k].candidates || []).length) return k;
  }
  for (var j = 0; j < MODES.length; j++){
    var k2 = MODES[j].key;
    if ((DATA.shortlist || {})[k2] && DATA.shortlist[k2].length) return k2;
  }
  return "positional";
}

/* ---------------- header ---------------- */
function renderStamps(){
  var box = $("stamps"); box.innerHTML = "";
  function add(label, value, cls){
    var s = el("span", "stamp" + (cls ? " " + cls : ""));
    s.appendChild(document.createTextNode(label + " "));
    s.appendChild(el("b", null, value));
    box.appendChild(s);
  }
  var age = minsSince(DATA.generated_at);
  var stale = age !== null && age > 24 * 60;
  add("computed", fmtIST(DATA.generated_at), stale ? "bad" : "");
  if (stale) add("STALE", Math.floor(age / 60) + " hours old", "bad");

  if (NEWS){
    var na = minsSince(NEWS.fetched_at);
    add("news", fmtIST(NEWS.fetched_at), (na !== null && na > 60) ? "warn" : "");
  } else {
    add("news", "unavailable", "warn");
  }

  var u = DATA.universe || {};
  add("scanned", String(u.symbols_scanned === undefined ? DASH : u.symbols_scanned));

  var sc = DATA.scorecard || {};
  if (sc.status === "live"){
    add("hit rate", num(sc.hit_rate_pct, 1) + "%");
    add("net expectancy", num(sc.net_expectancy, 2) + "%");
  } else {
    add("track record", String(sc.calls_logged === undefined ? DASH : sc.calls_logged) + " calls logged");
  }

  var f = DATA.fundamentals || {};
  if (!f.available) add("fundamentals", "unavailable", "warn");
}

function renderModes(){
  var box = $("modes"); box.innerHTML = "";
  MODES.forEach(function(m){
    var tt = (DATA.trade_types || {})[m.key] || {};
    var n = (tt.candidates || []).length;
    var sn = ((DATA.shortlist || {})[m.key] || []).length;
    var b = el("button", "mode");
    b.type = "button";
    b.setAttribute("aria-pressed", m.key === mode ? "true" : "false");
    b.appendChild(el("span", "mt", m.title));
    b.appendChild(el("span", "ms", n + " trade-ready · " + sn + " shortlisted"));
    b.title = m.sub;
    b.onclick = function(){ mode = m.key; render(); };
    box.appendChild(b);
  });
}

/* ---------------- tables ---------------- */
function flagTag(f){
  var cls = "tag " + f.kind;
  if (f.kind === "move") cls = "tag " + (String(f.label).charAt(0) === "-" ? "move-down" : "move-up");
  var t = el("span", cls, f.label);
  t.title = f.detail || "";
  return t;
}

function headerRow(cols){
  var tr = el("tr");
  cols.forEach(function(c){ tr.appendChild(el("th", null, c)); });
  var thead = el("thead"); thead.appendChild(tr);
  return thead;
}

function tableShell(cols){
  var wrap = el("div", "tablewrap");
  var t = el("table");
  t.appendChild(headerRow(cols));
  var tb = el("tbody");
  t.appendChild(tb);
  wrap.appendChild(t);
  return { wrap: wrap, body: tb, span: cols.length };
}

function newsFor(sym){
  return (NEWS && NEWS.by_symbol && NEWS.by_symbol[sym]) || [];
}

function attachDetail(tr, sym, detailBuilder, span){
  var open = null;
  tr.onclick = function(){
    if (open){ open.remove(); open = null; tr.classList.remove("open"); return; }
    open = detailBuilder(span);
    tr.classList.add("open");
    tr.parentNode.insertBefore(open, tr.nextSibling);
  };
}

function renderGated(){
  var tt = (DATA.trade_types || {})[mode] || {};
  var syms = tt.candidates || [];
  var hasQty = !!(PRIV && PRIV.sizing);

  $("gated-count").textContent = syms.length + " passed every gate";
  $("gated-sub").textContent =
    "Every threshold in the specification applied: liquidity, measured reward "
    + "to risk against a real overhead level, surveillance and ban lists, "
    + "circuit locks, a results blackout, and position sizing. Few passing is "
    + "the intended behaviour.";

  var host = $("gated-body"); host.innerHTML = "";

  if (!syms.length){
    if (mode === "intraday" || mode === "swing"){
      host.appendChild(intradayNotice());
    } else {
      var e = el("div", "empty");
      e.textContent = "Nothing cleared every gate for this horizon. "
        + tt.rejected + " symbols were rejected; the reasons are below.";
      host.appendChild(e);
    }
    return;
  }

  var cols = ["Symbol", "Close", "Chg", "Entry above", "Stop", "Target", "R:R"];
  if (hasQty) cols.push("Qty");
  cols.push("Why");
  var t = tableShell(cols);

  syms.forEach(function(sym){
    var c = DATA.symbols[sym];
    var ex = c.execution || {};
    var d1 = (c.timeframes || {})["1d"] || {};
    var tr = el("tr");
    tr.appendChild(el("td", "sym", sym));
    tr.appendChild(el("td", "num", num(d1.close)));
    tr.appendChild(el("td", "num " + signClass(c.pct_change), pct(c.pct_change)));
    tr.appendChild(el("td", "num", num(ex.trigger_entry)));
    tr.appendChild(el("td", "num", num(ex.hard_stop)));
    tr.appendChild(el("td", "num", num(ex.target_1)));
    tr.appendChild(el("td", "num", num(ex.rr_to_t1, 2)));
    if (hasQty){
      var q = (PRIV.sizing[sym] || {}).qty_for_risk;
      tr.appendChild(el("td", "num", q === undefined || q === null ? DASH : String(q)));
    }
    var why = el("td");
    (c.catalyst_flags || []).forEach(function(f){ why.appendChild(flagTag(f)); });
    var v = (c.verdict || {}).label;
    if (v) why.appendChild(el("span", "tag v-" + v, String(v).replace(/_/g, " ").toLowerCase()));
    tr.appendChild(why);

    attachDetail(tr, sym, function(span){ return detailRow(sym, c, span); }, t.span);
    t.body.appendChild(tr);
  });

  host.appendChild(t.wrap);
}

function intradayNotice(){
  var d = el("div", "callout warn");
  var p1 = el("p");
  p1.appendChild(el("b", null, "Intraday has no data source yet. "));
  p1.appendChild(document.createTextNode(
    "The daily bhavcopy that feeds everything else is end-of-day only, so "
    + "fifteen- and five-minute candles cannot be derived from it at all. "
    + "They come from the broker feed."));
  d.appendChild(p1);
  var p2 = el("p");
  p2.appendChild(document.createTextNode("Fill in "));
  p2.appendChild(el("code", null, "config/broker.yaml"));
  p2.appendChild(document.createTextNode(" and run "));
  p2.appendChild(el("code", null, "python -m src.intraday"));
  p2.appendChild(document.createTextNode(", then rescan with "));
  p2.appendChild(el("code", null, "python -m src.scan --with-intraday"));
  p2.appendChild(document.createTextNode("."));
  d.appendChild(p2);
  var p3 = el("p");
  p3.appendChild(document.createTextNode(
    "Short term is not relabelled as intraday in the meantime: a daily-bar "
    + "signal presented as a same-day one would be wrong in a way nobody "
    + "could see. The shortlist below still works, since it is driven by "
    + "movement, volume and breakout distance from daily data."));
  d.appendChild(p3);
  return d;
}

function renderShortlist(){
  var rows = ((DATA.shortlist || {})[mode]) || [];
  $("short-count").textContent = rows.length + " names";
  $("short-sub").textContent = DATA.shortlist_note || "";

  var host = $("short-body"); host.innerHTML = "";
  if (!rows.length){
    host.appendChild(el("div", "empty", "No symbol currently shows a computed catalyst."));
    return;
  }

  var cols = ["Symbol", "Close", "Chg", "Sector", "Mom", "Catalysts", "Blocked by"];
  var t = tableShell(cols);

  rows.forEach(function(r){
    var tr = el("tr");
    tr.appendChild(el("td", "sym", r.symbol));
    tr.appendChild(el("td", "num", num(r.close)));
    tr.appendChild(el("td", "num " + signClass(r.pct_change), pct(r.pct_change)));
    tr.appendChild(el("td", null, (r.sector || DASH).replace(/^NIFTY /, "")));
    tr.appendChild(el("td", "num", r.momentum_rank_in_segment ? "#" + r.momentum_rank_in_segment : DASH));
    var cat = el("td");
    (r.catalyst_flags || []).forEach(function(f){ cat.appendChild(flagTag(f)); });
    tr.appendChild(cat);
    var blocked = el("td");
    var fg = r.failed_gates || [];
    blocked.textContent = fg.length ? shortGate(fg[0]) : "cap only";
    blocked.title = fg.join(" | ");
    blocked.className = "flat";
    tr.appendChild(blocked);

    attachDetail(tr, r.symbol, function(span){
      return shortDetailRow(r, span);
    }, t.span);
    t.body.appendChild(tr);
  });

  host.appendChild(t.wrap);
}

function shortGate(reason){
  var s = String(reason);
  if (s.indexOf("R:R") >= 0 || s.indexOf("reward") >= 0) return "reward to risk";
  if (s.indexOf("turnover") >= 0) return "liquidity";
  if (s.indexOf("results") >= 0) return "results blackout";
  if (s.indexOf("surveillance") >= 0) return "surveillance list";
  if (s.indexOf("circuit") >= 0) return "circuit locked";
  if (s.indexOf("EMA") >= 0) return "trend filter";
  if (s.indexOf("sizing") >= 0) return "sizing";
  if (s.indexOf("corporate action") >= 0) return "unadjusted split";
  if (s.indexOf("no 1h") >= 0 || s.indexOf("no 15m") >= 0 || s.indexOf("no 5m") >= 0) return "no intraday data";
  return s.length > 34 ? s.slice(0, 32) + "…" : s;
}

/* ---------------- detail rows ---------------- */
function kvCard(title, pairs){
  var c = el("div", "dcard");
  c.appendChild(el("h3", null, title));
  var dl = el("dl", "kv");
  pairs.forEach(function(p){
    dl.appendChild(el("dt", null, p[0]));
    dl.appendChild(el("dd", null, p[1]));
  });
  c.appendChild(dl);
  return c;
}

function newsCard(sym){
  var items = newsFor(sym);
  var c = el("div", "dcard");
  c.appendChild(el("h3", null, "Headlines (" + items.length + ")"));
  if (!items.length){
    c.appendChild(el("div", "note", "No mapped headline in the window."));
  } else {
    items.forEach(function(it){
      var w = el("div", "nitem");
      var a = el("a", null, it.headline);
      a.href = it.url; a.target = "_blank"; a.rel = "noopener noreferrer";
      w.appendChild(a);
      w.appendChild(el("div", "nmeta", (it.publisher || "") + " · " + fmtIST(it.published)));
      c.appendChild(w);
    });
  }
  c.appendChild(el("div", "note",
    "Headlines are shown for context. They never affect a level, a gate or a "
    + "ranking."));
  return c;
}

function detailRow(sym, c, span){
  var tr = el("tr", "detail");
  var td = el("td"); td.colSpan = span;
  var grid = el("div", "dgrid");
  var d1 = (c.timeframes || {})["1d"] || {};
  var ex = c.execution || {};
  var m = c.momentum || {};

  grid.appendChild(kvCard("Daily indicators", [
    ["close", num(d1.close)],
    ["20 EMA", num(d1.ema20)],
    ["50 EMA", num(d1.ema50)],
    ["200 EMA", d1.ema200 === null ? "under 200 bars" : num(d1.ema200)],
    ["RSI", num(d1.rsi14, 1)],
    ["ATR", num(d1.atr14)],
    ["volume vs avg", num(d1.volume_ratio, 2) + "x"],
    ["bars", String(d1.bars || DASH)]
  ]));

  grid.appendChild(kvCard("Levels", [
    ["entry above", num(ex.trigger_entry)],
    ["stop", num(ex.hard_stop)],
    ["risk per share", num(ex.risk_per_share)],
    ["target", num(ex.target_1)],
    ["target source", ex.target_1_source || DASH],
    ["second target", num(ex.target_2)],
    ["reward to risk", num(ex.rr_to_t1, 2)],
    ["support", (d1.support_levels || []).map(function(x){ return num(x); }).join("  ") || DASH],
    ["resistance", (d1.resistance_levels || []).map(function(x){ return num(x); }).join("  ") || DASH]
  ]));

  grid.appendChild(kvCard("Standing", [
    ["segment", c.segment || DASH],
    ["sector", (c.sector || DASH).replace(/^NIFTY /, "")],
    ["momentum rank", m.rank_in_segment ? "#" + m.rank_in_segment : DASH],
    ["percentile", num(m.percentile_in_segment, 1)],
    ["six month return", pct(m.return_6m === null || m.return_6m === undefined ? null : m.return_6m * 100)],
    ["twelve month", pct(m.return_12m === null || m.return_12m === undefined ? null : m.return_12m * 100)],
    ["turnover", num(c.turnover_20d_cr, 2) + " cr"],
    ["factor tags", (c.factor_tags || []).join(", ") || "none"]
  ]));

  var vc = el("div", "dcard");
  vc.appendChild(el("h3", null, "How the verdict was reached"));
  ((c.verdict || {}).reasons || []).forEach(function(r){
    vc.appendChild(el("div", "note", r));
  });
  if (ex.invalid_reason) vc.appendChild(el("div", "note bad", ex.invalid_reason));
  grid.appendChild(vc);

  grid.appendChild(newsCard(sym));

  td.appendChild(grid);
  tr.appendChild(td);
  return tr;
}

function shortDetailRow(r, span){
  var tr = el("tr", "detail");
  var td = el("td"); td.colSpan = span;
  var grid = el("div", "dgrid");

  grid.appendChild(kvCard("Where it stands", [
    ["close", num(r.close)],
    ["change", pct(r.pct_change)],
    ["segment", r.segment || DASH],
    ["momentum rank", r.momentum_rank_in_segment ? "#" + r.momentum_rank_in_segment : DASH],
    ["percentile", num(r.percentile_in_segment, 1)],
    ["turnover", num(r.turnover_20d_cr, 2) + " cr"],
    ["verdict", r.verdict ? String(r.verdict).replace(/_/g, " ").toLowerCase() : DASH]
  ]));

  var lv = kvCard("Indicative levels", [
    ["entry above", num(r.trigger_entry)],
    ["stop", num(r.hard_stop)],
    ["target", num(r.target_1)],
    ["reward to risk", num(r.rr_to_t1, 2)]
  ]);
  if (r.rr_is_measured === false){
    lv.appendChild(el("div", "note bad",
      "The target here was assumed rather than measured against a real "
      + "overhead level, so this reward-to-risk figure cannot be relied on."));
  }
  grid.appendChild(lv);

  var cc = el("div", "dcard");
  cc.appendChild(el("h3", null, "Catalysts, computed"));
  (r.catalyst_flags || []).forEach(function(f){
    cc.appendChild(el("div", "note", f.label + " — " + (f.detail || "")));
  });
  grid.appendChild(cc);

  var gc = el("div", "dcard");
  gc.appendChild(el("h3", null, "Gates it did not clear"));
  var fg = r.failed_gates || [];
  if (!fg.length){
    gc.appendChild(el("div", "note", "Cleared the gates but fell outside the per-horizon or per-sector cap."));
  }
  fg.forEach(function(x){ gc.appendChild(el("div", "note bad", x)); });
  grid.appendChild(gc);

  grid.appendChild(newsCard(r.symbol));

  td.appendChild(grid);
  tr.appendChild(td);
  return tr;
}

/* ---------------- why so few ---------------- */
function renderWhy(){
  var rej = (DATA.rejected || {})[mode] || [];
  $("why-summary").textContent = "Why so few passed — " + rej.length + " rejected";
  $("why-sub").textContent =
    "Grouped reasons. A permanently empty list here would mean the gates are "
    + "decorative, so it is shown rather than hidden.";

  var counts = {};
  rej.forEach(function(r){
    (r.reasons || []).forEach(function(x){
      var k = shortGate(x);
      counts[k] = (counts[k] || 0) + 1;
    });
  });
  var keys = Object.keys(counts).sort(function(a, b){ return counts[b] - counts[a]; });

  var host = $("why-body"); host.innerHTML = "";
  if (!keys.length){
    host.appendChild(el("div", "note",
      "Nothing was rejected, which with a universe this wide is implausible. "
      + "Check the thresholds and the gate feeds."));
    return;
  }
  keys.forEach(function(k){
    var row = el("div", "rrow");
    row.appendChild(el("span", "rn", String(counts[k])));
    row.appendChild(el("span", null, k));
    host.appendChild(row);
  });

  var gf = DATA.gate_feeds_unavailable || {};
  Object.keys(gf).forEach(function(k){
    host.appendChild(el("div", "note bad", k + ": " + gf[k]
      + " — gates needing it held candidates back rather than passing them."));
  });
}

function renderDisclaimer(){
  var d = $("disclaimer"); d.innerHTML = "";
  d.appendChild(el("p", null, DATA.disclaimer || ""));
  var notes = [];
  if ((DATA.momentum_meta || {}).eligibility_note) notes.push(DATA.momentum_meta.eligibility_note);
  notes.push("Price history comes from NSE's end-of-day bhavcopy, which is "
    + "unadjusted, so any symbol whose series contains an unadjusted split or "
    + "bonus is excluded rather than shown with levels drawn across the gap.");
  notes.push("A target is the next real overhead level, never a multiple of "
    + "the risk. Where no such level exists the figure is marked as assumed "
    + "and cannot satisfy the reward-to-risk gate.");
  notes.forEach(function(n){ d.appendChild(el("p", null, n)); });
}

function render(){
  if (!DATA) return;
  renderStamps();
  renderModes();
  renderGated();
  renderShortlist();
  renderWhy();
  renderDisclaimer();
}

boot();
</script>
